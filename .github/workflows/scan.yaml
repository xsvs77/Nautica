name: Proxy Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nautica-proxy-scan
  cancel-in-progress: false

jobs:
  scanner:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - name: Start Scan
        run: |
          bun install
          bun run ./helper/proxyip.ts
      - name: Publish Result
        if: ${{ success() }}
        run: |
          git config user.name "Github Actions"
          git config user.email "actions@github.com"
          git add -- kvProxyList.json rawProxyList.txt proxyList.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update proxyip"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
