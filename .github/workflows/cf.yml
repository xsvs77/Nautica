name: ⛅ CF Worker

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy Worker (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Record deployed revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        with:
          wranglerVersion: "4"
          command: deploy

      - name: Deployment notice
        run: echo "::notice::Deployed revision ${{ steps.revision.outputs.sha }}"
