name: Refresh Indonesia Proxy Bank

on:
  push:
    branches:
      - main
    paths:
      - scripts/update_proxy_bank.py
      - .github/workflows/refresh-indonesia-proxies.yml
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indonesia-proxy-bank
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect and verify Indonesia proxies
        run: python3 scripts/update_proxy_bank.py
      - name: Commit updated proxy bank
        run: |
          if git diff --quiet -- proxyList-ID.txt proxyList-ID-metrics.json; then
            echo "Proxy bank and metrics unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxyList-ID.txt proxyList-ID-metrics.json
          git commit -m "Refresh verified Indonesia proxy bank"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retry $attempt/3."
            sleep $((attempt * 2))
          done
          exit 1
